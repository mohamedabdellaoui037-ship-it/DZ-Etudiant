<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Hub – روابط الطالب</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#6b7288;--ac:#2f6fed;--bd:#e3e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e2a;--tx:#eef0f7;--mu:#9aa1b8;--ac:#6f9bff;--bd:#2a2e3f}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--tx:#eef0f7;--mu:#9aa1b8;--ac:#6f9bff;--bd:#2a2e3f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
input{width:100%;margin:6px 0}
button.p{background:var(--ac);color:#fff;border:0;width:100%;margin-top:6px}
button.l{background:none;border:0;color:var(--ac);padding:4px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
a.i{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;text-decoration:none;color:var(--tx);font-size:14px}
a.i:hover{border-color:var(--ac)}
a.i b{font-size:22px}
.m{color:var(--mu);font-size:13px}
.r{display:flex;gap:12px;margin:6px 0}
.r label{display:flex;gap:4px;align-items:center}
.r input{width:auto;margin:0}
</style>
</head>
<body>
<div class="w">
<div class="bar"><h1>🎓 Student Hub</h1>
<select id="lg"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div>
<div id="app"></div>
</div>

{r:"all",i:"🕌",n:{ar:"المكتبات العربية",fr:"Bibliothèques arabes",en:"Arabic libraries"},l:[["💡","مكتبة النور","https://www.noor-book.com"],["📚","المكتبة الشاملة","https://shamela.ws"],["📖","هنداوي","https://www.hindawi.org"],["🗃️","المكتبة الوقفية","https://waqfeya.net"],["📜","ويكي مصدر","https://ar.wikisource.org"],["🔤","المعاني","https://www.almaany.com"],["📰","دار المنظومة","https://search.mandumah.com"]]},
{r:"all",i:"🗣️",n:{ar:"اللغات والقواميس",fr:"Langues et dictionnaires",en:"Languages and dictionaries"},l:[["📕","Larousse","https://www.larousse.fr"],["🔁","Reverso","https://www.reverso.net"],["🈸","Linguee","https://www.linguee.com"],["🦉","Duolingo","https://www.duolingo.com"],["✅","Grammarly","https://www.grammarly.com"],["🇬🇧","BBC Learning English","https://www.bbc.co.uk/learningenglish"],["🔊","Forvo","https://forvo.com"]]},
{r:"all",i:"🌐",n:{ar:"مواقع مفيدة",fr:"Sites utiles",en:"Useful websites"},l:[["🔎","Google Scholar","https://scholar.google.com"],["🎬","Khan Academy","https://www.khanacademy.org"],["💻","Coursera","https://www.coursera.org"],["🧠","edX","https://www.edx.org"],["🌍","Wikipedia","https://www.wikipedia.org"],["🈯","DeepL","https://www.deepl.com"],["📝","Canva","https://www.canva.com"],["🗒️","Notion","https://www.notion.so"],["☁️","Google Drive","https://drive.google.com"],["🃏","Quizlet","https://quizlet.com"],["📑","iLovePDF","https://www.ilovepdf.com"],["✂️","remove.bg","https://www.remove.bg"],["▶️","YouTube","https://www.youtube.com"],["🎧","TED","https://www.ted.com"]]},

{r:"all",i:"✨",n:{ar:"الذكاء الاصطناعي",fr:"Intelligence artificielle",en:"AI tools"},l:[["🤖","Claude","https://claude.ai"],["💬","ChatGPT","https://chatgpt.com"],["♊","Gemini","https://gemini.google.com"],["🔭","Perplexity","https://www.perplexity.ai"],["📓","NotebookLM","https://notebooklm.google.com"]]},
{r:"all",i:"🤖",n:{ar:"بوتات تلغرام",fr:"Bots Telegram",en:"Telegram bots"},l:[["📚","@wiki","https://t.me/wiki"],["🎥","@vid","https://t.me/vid"],["🖼️","@pic","https://t.me/pic"],["🎞️","@gif","https://t.me/gif"],["🎬","@imdb","https://t.me/imdb"],["🔎","@bing","https://t.me/bing"],["🎵","@DeezerMusicBot","https://t.me/DeezerMusicBot"],["🎨","@Stickers","https://t.me/Stickers"],["🆔","@userinfobot","https://t.me/userinfobot"],["🛠️","@BotFather","https://t.me/BotFather"],["🎮","@gamee","https://t.me/gamee"]]},
{r:"teacher",i:"👨‍🏫",n:{ar:"روابط الأستاذ",fr:"Liens enseignant",en:"Teacher links"},l:[["🎓","Progrès (enseignant)","https://progres.mesrs.dz"],["📰","ASJP","https://www.asjp.cerist.dz"],["🔬","ResearchGate","https://www.researchgate.net"],["📑","Zotero","https://www.zotero.org"],["📚","Mendeley","https://www.mendeley.com"],["✍️","Overleaf","https://www.overleaf.com"],["🆔","ORCID","https://orcid.org"],["🧮","Moodle","https://moodle.org"],["📊","Google Forms","https://forms.google.com"],["🎥","Zoom","https://zoom.us"],["🟦","Microsoft Teams","https://www.microsoft.com/microsoft-teams"],["🧑‍🏫","Kahoot","https://kahoot.com"],["🔍","Turnitin","https://www.turnitin.com"],["📐","Scopus","https://www.scopus.com"],["🏅","Web of Science","https://www.webofscience.com"]]}
];
var L=localStorage.getItem?"ar":"ar",U=null,reg=false,msg="",qs="";
try{L=localStorage.getItem("lg")||"ar";U=JSON.parse(localStorage.getItem("cur")||"null")}catch(e){}
function users(){try{return JSON.parse(localStorage.getItem("users")||"[]")}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function h(x){return btoa(unescape(encodeURIComponent(x)))}
function draw(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.getElementById("lg").value=L;
 var a=document.getElementById("app");
 if(!U){
  a.innerHTML='<p class="m">'+t.t+'</p><div class="c"><h2>'+(reg?t.reg:t.log)+'</h2>'+(reg?'<input id="n" placeholder="'+t.nm+'">':'')+'<input id="e" type="email" placeholder="'+t.em+'"><input id="p" type="password" placeholder="'+t.pw+'">'+(reg?'<div class="r"><label><input type="radio" name="ro" value="student" checked>'+t.st+'</label><label><input type="radio" name="ro" value="teacher">'+t.pr+'</label></div>':'')+'<button class="p" id="go">'+t.go+'</button><p class="m" style="color:#d33">'+msg+'</p><button class="l" id="sw">'+(reg?t.sw:t.sr)+'</button><p class="m">'+t.nt+'</p><button class="l" id="rs" style="color:#d33">'+t.rs+'</button></div>';
  document.getElementById("sw").onclick=function(){reg=!reg;msg="";draw()};
  document.getElementById("go").onclick=auth;
  document.getElementById("rs").onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent=t.rc;return}try{localStorage.removeItem("users");localStorage.removeItem("cur")}catch(e){}U=null;msg="";reg=true;draw()};return;
 }
 var q=qs.toLowerCase(),o='<div class="bar"><span>'+t.hi+' '+esc(U.name)+' · '+(U.role=="teacher"?t.pr:t.st)+'</span><button class="l" id="ou">'+t.out+'</button></div><input id="q" placeholder="'+t.q+'" value="'+esc(qs)+'">',c=0;
 S.forEach(function(s){
  if(s.r=="teacher"&&U.role!="teacher")return;
  var it=s.l.filter(function(x){return !q||x[1].toLowerCase().indexOf(q)>-1});
  if(!it.length)return;c++;
  o+='<div class="c"><h2>'+s.i+' '+s.n[L]+'</h2><div class="g">'+it.map(function(x){return '<a class="i" target="_blank" rel="noopener noreferrer" href="'+x[2]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></a>'}).join("")+'</div></div>';
 });
 if(!c)o+='<p class="m">'+t.no+'</p>';
 a.innerHTML=o;
 document.getElementById("ou").onclick=function(){U=null;save("cur",null);draw()};
 var qi=document.getElementById("q");qi.oninput=function(){qs=qi.value;draw();var z=document.getElementById("q");z.focus();z.setSelectionRange(qs.length,qs.length)};
}
function auth(){
 var e=document.getElementById("e").value.trim().toLowerCase(),p=document.getElementById("p").value,us=users(),t=T[L];
 if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6){msg=t.er;return draw()}
 if(reg){
  var n=document.getElementById("n").value.trim(),ro=document.querySelector('input[name="ro"]:checked').value;
  if(!n){msg=t.er;return draw()}
  if(us.some(function(u){return u.e==e})){msg=t.ex;return draw()}
  var u={name:n,e:e,p:h(p),role:ro};us.push(u);save("users",us);U={name:n,e:e,role:ro};
 }else{
  var f=us.filter(function(u){return u.e==e&&u.p==h(p)})[0];
  if(!f){msg=t.er;return draw()}
  U={name:f.name,e:f.e,role:f.role};
 }
 msg="";save("cur",U);draw();
}
document.getElementById("lg").onchange=function(){L=this.value;try{localStorage.setItem("lg",L)}catch(e){}draw()};
draw();
</script>
